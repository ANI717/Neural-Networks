[project]
name = "pytorch"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv]
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
